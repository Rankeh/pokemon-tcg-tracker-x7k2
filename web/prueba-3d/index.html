<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171d">
  <title>Álbum 3D Teselia — Fase 3.6.2</title>
  <link rel="stylesheet" href="css/prueba-3d.css">
</head>
<body>
<main class="app">
  <canvas id="lienzo" aria-label="Álbum 3D de cartas. Arrastra para girar la vista ligeramente; toca una carta para abrir su ficha."></canvas>

  <header class="cabecera">
    <h1>Álbum Teselia <small id="progreso">…</small></h1>
    <p id="estado" role="status" aria-live="polite">Cargando…</p>
  </header>

  <p id="cargando" class="cargando">Cargando álbum…</p>
  <p id="aviso" class="aviso" role="alert" hidden></p>

  <pre id="diag" class="diag" hidden aria-label="Diagnóstico"></pre>
  <pre id="panel" class="panel" aria-label="Métricas de rendimiento" hidden></pre>
  <textarea id="informe" class="informe" rows="8" readonly hidden aria-label="Informe de métricas (copia este texto)"></textarea>

  <div id="f-fondo" class="ficha-fondo" hidden></div>
  <section id="ficha" class="ficha" hidden role="dialog" aria-modal="true" aria-labelledby="f-nombre">
    <button type="button" id="f-cerrar" class="ficha-cerrar" aria-label="Cerrar ficha">✕</button>
    <div id="f-imagen" class="ficha-imagen"></div>
    <div class="ficha-cuerpo">
      <h2 id="f-nombre"></h2>
      <p class="ficha-exp" id="f-exp"></p>
      <p class="ficha-num" id="f-num"></p>
      <div class="ficha-cantidad">
        <button type="button" id="f-menos" class="paso" aria-label="Retirar una copia">−</button>
        <div class="ficha-total" aria-live="polite"><strong id="f-cant">0</strong><span id="f-estado-txt"></span></div>
        <button type="button" id="f-mas" class="paso paso-mas" aria-label="Añadir una copia">+</button>
      </div>
      <p id="f-error" class="ficha-error" role="alert"></p>
    </div>
  </section>

  <nav class="barra" id="barra" aria-label="Navegación del álbum">
    <button type="button" id="b-abrir" class="principal">Abrir álbum</button>
    <button type="button" id="b-ant" aria-label="Hoja anterior">‹</button>
    <label class="salto"><span class="solo-lector">Ir a la página</span>
      <select id="b-salto" aria-label="Ir a la página"></select></label>
    <button type="button" id="b-sig" aria-label="Hoja siguiente">›</button>
    <button type="button" id="b-metricas" class="secundario">Métricas</button>
    <button type="button" id="b-medir" class="secundario">Medir</button>
    <button type="button" id="b-informe" class="secundario">Informe</button>
  </nav>
</main>

<script>
// Captura de errores desde el primer instante (se ven en el modo ?debug=1 sin necesitar la consola de Safari).
window.__errores = [];
addEventListener('error', (e) => window.__errores.push('JS: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'));
addEventListener('unhandledrejection', (e) => window.__errores.push('Promesa: ' + (e.reason && e.reason.message || e.reason)));
</script>
<script>
// Arranque: Three.js se toma de web/vendor/three/ si está (funciona sin internet) y, si no, de jsDelivr con versión fija.
(async () => {
  const VERSION = '0.160.0';
  const cdn = 'https://cdn.jsdelivr.net/npm/three@' + VERSION + '/';
  let base = cdn, origen = 'CDN jsDelivr';
  try {
    const r = await fetch('../vendor/three/build/three.module.js', { method: 'HEAD' });
    if (r.ok) { base = new URL('../vendor/three/', location.href).href; origen = 'copia local web/vendor/three'; }
  } catch (e) { /* sin copia local: se usa el CDN */ }
  const mapa = document.createElement('script');
  mapa.type = 'importmap';
  mapa.textContent = JSON.stringify({ imports: { 'three': base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
  document.head.appendChild(mapa);
  window.__origenThree = origen;
  try { await import('./js/main.js'); }
  catch (e) {
    console.error(e);
    const c = document.getElementById('cargando');
    c.hidden = false;
    c.textContent = 'No se pudo cargar Three.js (' + origen + '). Sin internet, copia Three.js en web/vendor/three/ (ver web/vendor/LEEME.md). ' + e.message;
  }
})();
</script>
</body>
</html>
