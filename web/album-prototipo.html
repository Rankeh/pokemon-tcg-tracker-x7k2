<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1f17">
  <title>Álbum Teselia — prototipo 3.3.1</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/album-escena.css">
  <link rel="stylesheet" href="css/entorno.css">
  <link rel="stylesheet" href="css/archivador.css">
  <link rel="stylesheet" href="css/interfaz.css">
  <link rel="stylesheet" href="css/album-bolsillos.css">
  <link rel="stylesheet" href="css/album-ficha.css">
</head>
<body>
<div class="app">
  <header class="cabecera">
    <h1>Álbum Teselia</h1>
    <p class="subtitulo">Ilustraciones especiales de la región de Teselia</p>
    <div class="ficha-progreso">
      <span class="ficha-progreso-etiqueta" aria-hidden="true">Mi colección</span>
      <p class="progreso" id="progreso" aria-live="polite">Cargando…</p>
      <div class="barra-progreso" aria-hidden="true"><i id="barra"></i></div>
    </div>
  </header>
  <p class="aviso" id="aviso" role="alert" hidden></p>
  <main class="escena" id="escena" aria-label="Página del álbum con nueve bolsillos"></main>
  <footer class="pie">
    <nav class="paginador" aria-label="Páginas del álbum">
      <button type="button" class="boton boton-flecha" id="anterior" aria-label="Página anterior">‹</button>
      <div class="pagina-info" aria-live="polite">
        <strong id="pagina-numero">Página –</strong>
        <small id="pagina-rango"></small>
      </div>
      <button type="button" class="boton boton-flecha" id="siguiente" aria-label="Página siguiente">›</button>
    </nav>
    <div class="filtros" role="group" aria-label="Resaltar cartas (no cambia el orden)">
      <button type="button" class="boton chip" data-filtro="todas" aria-pressed="true">Todas</button>
      <button type="button" class="boton chip" data-filtro="sv10.5b" aria-pressed="false">Fulgor Negro</button>
      <button type="button" class="boton chip" data-filtro="sv10.5w" aria-pressed="false">Llama Blanca</button>
      <button type="button" class="boton chip" data-filtro="svp" aria-pressed="false">Promos</button>
      <button type="button" class="boton chip" data-filtro="pendientes" aria-pressed="false">Pendientes</button>
    </div>
    <div class="extras">
      <button type="button" class="boton chip" id="movimiento" aria-pressed="false">Reducir movimiento</button>
      <a class="enlace-copias" href="prueba-almacenamiento.html">Copias de seguridad</a>
    </div>
    <p class="ayuda" aria-hidden="true">
      <span><kbd>←</kbd><kbd>→</kbd> Pasar página</span>
      <span><kbd>Esc</kbd> Cerrar ficha</span>
    </p>
  </footer>
</div>
<div class="ficha" id="ficha" hidden></div>
<script type="module" src="js/album-prototipo.js"></script>
</body>
</html>
