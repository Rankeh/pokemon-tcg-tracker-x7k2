<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ea">
  <title>Mi biblioteca · Pokémon TCG Tracker</title>
  <meta name="description" content="Biblioteca personal de álbumes de cartas del JCC Pokémon.">
  <link rel="stylesheet" href="web/diorama/diorama.css">
  <link rel="stylesheet" href="web/estanteria/css/estanteria.css">
</head>
<body class="d-fondo">
  <canvas id="lienzo" tabindex="-1" aria-label="Estantería 3D con tus álbumes. Toca el lomo de un álbum para abrirlo; desliza arriba y abajo para recorrer las baldas."></canvas>
  <p class="cargando" id="cargando">Preparando la biblioteca…</p>

  <header class="cabecera">
    <div class="titulo d-panel">
      <h1>Mi biblioteca</h1>
      <span class="d-chapa" id="contador">…</span>
    </div>
    <a class="d-boton" href="web/cuenta.html" aria-label="Mi cuenta">Cuenta</a>
  </header>

  <p class="pista d-panel" id="pista">Toca un lomo para abrirlo<span id="desplazar" hidden> · desliza para ver más baldas</span></p>
  <p class="aviso d-aviso" id="aviso" role="status" aria-live="polite" hidden></p>

  <!-- Los mismos álbumes que la estantería, como enlaces: lector de pantalla, teclado (Tab) y respaldo si no hay WebGL -->
  <nav class="lista-albumes d-panel" aria-label="Álbumes de la biblioteca">
    <ul id="lista-albumes"><li><a href="web/prueba-3d/index.html">Teselia — Llama Blanca · Fulgor Negro</a></li></ul>
  </nav>

<script>
// Arranque: Three.js 0.160.0 (la misma versión que el álbum 3D). Se usa web/vendor/three/ si tiene todo lo necesario; si no, jsDelivr.
(async () => {
  const VERSION = '0.160.0';
  const cdn = 'https://cdn.jsdelivr.net/npm/three@' + VERSION + '/';
  let base = cdn;
  try {
    const local = new URL('web/vendor/three/', location.href).href;
    const [a, b] = await Promise.all(['build/three.module.js', 'examples/jsm/geometries/RoundedBoxGeometry.js'].map((p) => fetch(local + p, { method: 'HEAD' })));
    if (a.ok && b.ok) base = local;
  } catch (e) { /* sin copia local: CDN */ }
  const mapa = document.createElement('script');
  mapa.type = 'importmap';
  mapa.textContent = JSON.stringify({ imports: { 'three': base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
  document.head.appendChild(mapa);
  try { await import('./web/estanteria/js/main.js'); }
  catch (e) {
    console.error(e);
    document.body.classList.add('sin-3d');
    document.getElementById('cargando').textContent = 'No se pudo cargar la estantería 3D. Puedes abrir tus álbumes desde la lista.';
  }
})();
</script>
</body>
</html>
