<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas — Etapa 3.1 (álbum)</title>
<style>body{font:15px/1.5 ui-monospace,monospace;padding:1rem}.OK{color:#1e8e3e}.FALLO{color:#c0392b;font-weight:bold}.SALTADA{color:#888}.RESUMEN{font-weight:bold;margin-top:1rem}</style></head>
<body><h1>Pruebas de la Etapa 3.1 (álbum)</h1><pre id="salida"></pre>
<script type="module">
  import { ejecutar } from "./pruebas-album.js";
  const salida = document.getElementById("salida");
  const ok = await ejecutar((estado, texto) => {
    const l = document.createElement("div"); l.className = estado; l.textContent = `${estado.padEnd(8)} ${texto}`; salida.append(l);
  });
  document.title = (ok ? "TODO OK" : "HAY FALLOS") + " — Pruebas Etapa 3.1 (álbum)";
</script></body></html>
