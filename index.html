<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Biblioteca · Pokémon TCG Tracker</title>
  <meta name="description" content="Biblioteca personal de álbumes de cartas del JCC Pokémon.">
  <script src="web/editorial/modo.js"></script>
  <link rel="stylesheet" href="web/editorial/editorial.css">
  <link rel="stylesheet" href="web/estanteria/css/estanteria.css">
</head>
<body class="e-fondo">
  <canvas id="lienzo" tabindex="-1" aria-label="Biblioteca de álbumes. Desliza a los lados para elegir un álbum; toca la portada para abrirlo."></canvas>
  <div class="velo" aria-hidden="true"></div>
  <p class="cargando e-etiqueta" id="cargando">Preparando la biblioteca…</p>

  <header class="cabecera">
    <a class="e-caja" href="web/cuenta.html">Cuenta</a>
    <a class="marca" href="./" aria-label="Biblioteca">
      <span class="marca-sello" aria-hidden="true">TCG</span>
      <span class="marca-texto"><span>Biblioteca</span><span>Pokémon TCG</span></span>
    </a>
    <div class="derecha">
      <p class="contador e-etiqueta" id="contador">…</p>
      <button type="button" class="e-caja e-modo" data-alternar-modo aria-label="Cambiar de modo"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <nav class="filtros e-pestanas" id="filtros" aria-label="Filtrar por serie"></nav>

  <button type="button" class="flecha izq e-redondo" id="ant" aria-label="Álbum anterior">←</button>
  <button type="button" class="flecha der e-redondo" id="sig" aria-label="Álbum siguiente">→</button>

  <section class="info" id="info" aria-live="polite">
    <h2 id="i-titulo">…</h2>
    <p class="sub e-etiqueta e-rojo" id="i-sub"></p>
    <p class="meta e-etiqueta" id="i-meta"></p>
    <button type="button" class="abrir e-caja e-llena" id="abrir">Abrir álbum</button>
  </section>

  <footer class="pie">
    <p class="e-etiqueta posicion" id="posicion">01 / 01</p>
    <p class="e-etiqueta ayuda" style="color: var(--e-tenue)">← → para elegir · Enter para abrir</p>
    <p class="e-etiqueta" style="color: var(--e-tenue)">Uso personal · Imágenes TCGdex</p>
  </footer>

  <p class="aviso e-aviso" id="aviso" role="status" aria-live="polite" hidden></p>

  <!-- Los mismos álbumes como enlaces: lector de pantalla, teclado (Tab) y respaldo si no hay WebGL -->
  <nav class="lista-albumes" aria-label="Álbumes de la biblioteca">
    <ul id="lista-albumes"><li><a href="web/prueba-3d/index.html">Teselia — Llama Blanca · Fulgor Negro</a></li><li><a href="web/prueba-3d/index.html?album=asako-ito">Asako Ito — Colección de artista</a></li></ul>
  </nav>

<script>
// Arranque: Three.js 0.160.0 (la misma versión que el álbum 3D). Se usa web/vendor/three/ si tiene todo lo necesario; si no, jsDelivr.
(async () => {
  const VERSION = '0.160.0';
  const cdn = 'https://cdn.jsdelivr.net/npm/three@' + VERSION + '/';
  let base = cdn;
  try {
    const local = new URL('web/vendor/three/', location.href).href;
    const [a, b] = await Promise.all(['build/three.module.js', 'examples/jsm/geometries/RoundedBoxGeometry.js'].map((p) => fetch(local + p, { method: 'HEAD' })));
    if (a.ok && b.ok) base = local;
  } catch (e) { /* sin copia local: CDN */ }
  const mapa = document.createElement('script');
  mapa.type = 'importmap';
  mapa.textContent = JSON.stringify({ imports: { 'three': base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
  document.head.appendChild(mapa);
  try { await import('./web/estanteria/js/main.js'); }
  catch (e) {
    console.error(e);
    document.body.classList.add('sin-3d');
    document.getElementById('cargando').textContent = 'No se pudo cargar la biblioteca 3D. Puedes abrir tus álbumes desde la lista.';
  }
})();
</script>
</body>
</html>
